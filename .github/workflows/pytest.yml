name: Pytest

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
        shell: bash

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Tests
        run: uv run pytest tests/ -q -ra --cov=. --cov-report=term-missing --cov-report=xml --junitxml=junit/test-results.xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload pytest test results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: pytest-results-${{ matrix.os }}
          path: junit/test-results.xml
