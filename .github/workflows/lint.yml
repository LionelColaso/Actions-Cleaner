name: Lint

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .
