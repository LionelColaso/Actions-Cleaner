name: Lint

# Reusable only — called by ci.yml (PRs) and auto_build.yml (pushes to main).
# Ruff is pure syntax/style analysis: it never resolves imports or reads
# platform stubs, so its output is identical on every OS — one runner.
# (Mypy lives in mypy.yml as a 3-OS matrix, a separate job so a format
# failure cannot skip the type check.)
on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

