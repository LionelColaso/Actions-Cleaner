# Auto build on push to main and create an Edge release.
# Pull requests are covered by ci.yml (lint + pyright + pytest + build).

name: Auto Build

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  pre-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  pre-pyright:
    permissions:
      contents: read
    uses: ./.github/workflows/pyright.yml

  pre-test:
    permissions:
      contents: read
    uses: ./.github/workflows/pytest.yml

  build:
    needs: [pre-lint, pre-pyright, pre-test]
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      attest: true

  edge-release:
    needs: [build, pre-lint, pre-pyright, pre-test]
    if: >-
      needs.build.result == 'success'
      && needs.pre-lint.result == 'success'
      && needs.pre-pyright.result == 'success'
      && needs.pre-test.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Determine version
        id: meta
        shell: bash
        run: |
          version=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Package artifacts
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os, zipfile, shutil

          root = "artifacts"
          version = os.environ["VERSION"]
          platform_map = {
              "ubuntu-latest": "linux",
              "windows-latest": "windows",
              "macos-latest": "macos",
          }
          for name in sorted(os.listdir(root)):
              src = os.path.join(root, name)
              if not os.path.isdir(src) or not name.startswith("actions-cleaner-"):
                  continue
              base = name.replace("actions-cleaner-", "", 1).removesuffix("-latest")
              dist_name = platform_map.get(base, base)
              zip_path = os.path.join(root, f"actions-cleaner-{version}-{dist_name}.zip")
              with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
                  for top, _dirs, files in os.walk(src):
                      for f in files:
                          full = os.path.join(top, f)
                          zf.write(full, os.path.relpath(full, src))
              print(f"packaged {name} -> {os.path.basename(zip_path)}")
              shutil.rmtree(src)
          PY

      - name: Create body
        id: body
        shell: bash
        run: |
          ACTION_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          message="Edge release ${{ steps.meta.outputs.version }}.
          Built from commit ${{ github.sha }}.

          > **⚠️ This is an unstable edge build from the latest main branch. It may contain bugs and breaking changes. Use stable releases for production.**

          Refer to the [action run]($ACTION_RUN_URL) that created this release."
          echo "body<<EOF"$'\n'"$message"$'\n'EOF >> "$GITHUB_OUTPUT"

      - name: Delete Previous Edge Release and Tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete Edge -y --cleanup-tag || echo "No previous release with tag Edge found"
          git tag -d Edge || echo "Edge tag doesn't exist locally"

      - name: Create Edge Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          artifacts: "artifacts/*.zip"
          tag: Edge
          name: "Edge Build (Unstable)"
          generateReleaseNotes: true
          prerelease: true
          draft: false
          body: ${{ steps.body.outputs.body }}
          allowUpdates: true
          removeArtifacts: true
          commit: ${{ github.sha }}
