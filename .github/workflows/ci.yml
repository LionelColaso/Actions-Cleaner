name: CI

on:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  mypy:
    permissions:
      contents: read
    uses: ./.github/workflows/mypy.yml

  pyright:
    permissions:
      contents: read
    uses: ./.github/workflows/pyright.yml

  pytest:
    permissions:
      contents: read
    uses: ./.github/workflows/pytest.yml

  build:
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      attest: false
