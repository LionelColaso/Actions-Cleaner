name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  mypy:
    permissions:
      contents: read
    uses: ./.github/workflows/mypy.yml

  pyright:
    permissions:
      contents: read
    uses: ./.github/workflows/pyright.yml

  pytest:
    permissions:
      contents: read
    uses: ./.github/workflows/pytest.yml

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install gh CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run benchmark
        run: |
          echo "Running benchmark..."
          # This is a placeholder for actual benchmark logic
          # In a real scenario, you'd run a benchmark script that measures
          # gh run list/delete latency over time
          echo "Benchmark completed (placeholder)"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 30

  build:
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      attest: false
