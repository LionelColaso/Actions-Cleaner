name: Pyright

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Pyright
        run: uv run pyright -p pyproject.toml .
