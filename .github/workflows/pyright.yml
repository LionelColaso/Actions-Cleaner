name: Pyright

# Reusable only — called by ci.yml (PRs) and auto_build.yml (pushes to main).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Pyright
        run: uv run pyright -p pyproject.toml .
