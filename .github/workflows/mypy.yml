name: Mypy

# Reusable only — called by ci.yml (PRs) and auto_build.yml (pushes to main).
# Mypy resolves real platform stubs (PySide6 ships per-OS wheels, and
# sys.platform branches narrow differently), so it runs on all 3 OSes.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  mypy:
    name: mypy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Mypy
        run: uv run mypy .
