[project]
name = "actions-cleaner"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "PySide6>=6.7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-qt>=4",
  "pytest-mock>=3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyright>=1.1",
]

build = ["nuitka>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = ["actions_cleaner_gui.py", "scripts", "README.md", "AGENTS.md"]

[tool.uv]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
]

[tool.ruff]
line-length = 88
indent-width = 4
lint.extend-select = ["I"]
exclude = [
  "venv",
  ".venv",
  "build",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
pretty = true
exclude = ["venv", ".venv", "build"]

[tool.pyright]
pythonPlatform = "All"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
exclude = ["venv", ".venv", "build", "**/node_modules", "**/__pycache__", "**/.*"]
reportMissingTypeStubs = "warning"
reportUnknownMemberType = false
reportPrivateUsage = "none"
reportUnusedFunction = "none"
reportAttributeAccessIssue = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
  "tests/**",
  "scripts/**",
  "docs/**",
  "build/**",
  "dist/**",
  ".venv/**",
  "venv/**",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
